name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Commit error log on failure
        if: failure()
        run: |
          { grep -n -A 6 -E '\.java:[0-9]+: error' build.log | head -120; echo '--- tail ---'; tail -40 build.log; } > build-error.txt || true
          git config user.name "ci"
          git config user.email "ci@local"
          git add -f build-error.txt
          git commit -m "ci: build error log" || true
          git push || true

      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk fuyou.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fuyou-apk
          path: fuyou.apk

      # 顺便发个 release，这样不用登录也能直接下载
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 浮游 APK #${{ github.run_number }}
          files: fuyou.apk
          draft: false
          prerelease: true
